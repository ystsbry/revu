name: Lint workflows

# .github/workflows/ 配下のワークフロー定義を actionlint で静的検証する。
# 構文エラー、存在しない context 参照、shell（shellcheck 連携）などを検出する。

on:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        # 明示的に固定する。`latest` だと actionlint 側の新リリースだけで
        # ワークフローを変更していなくても CI が赤くなるため、更新は PR として入れる。
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

name: claude-review

# PR コメントに `/claude review` と書かれたら、revu の review-pr スキルで
# レビュー下書きを生成し、`revu submit --yes` で GitHub に投稿する。
#
# 役割分担:
#   - Claude (claude-code-action): review-pr スキルを実行し、
#     ~/.revu/{owner}/{repo}/pr-{N}/ に review.yml + summary.md +
#     comments/*.md を生成するだけ。GitHub への直接投稿はしない。
#   - revu submit: 上で生成された下書きを GitHub PR レビューとして投稿。

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.issue.pull_request != null
      && startsWith(github.event.comment.body, '/claude review')
      && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    # エージェントを起動する job なので、暴走・ハングしたときのコストを上限で抑える。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: install revu binary and skills
        run: |
          make install PREFIX="$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          make install-skills

      - name: configure gh auth for revu pr / submit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status

      - name: generate review draft with claude (review-pr skill)
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            この PR (#${{ github.event.issue.number }}, リポジトリ
            ${{ github.repository }}) を `review-pr` スキルでレビューしてください。

            出力先はスキルの規約に従ってください（`revu pr prepare` が返す
            review_dir 配下）。このワークフローが出力先を指定することはありません。

            レビュー成果物の生成だけを行い、GitHub への投稿（gh pr review 等）は
            **絶対に行わないでください**。投稿はこのワークフローの後段ステップで
            `revu submit --yes` が担当します。

            日本語で出力してください。
          claude_args: >
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(gh:*),Bash(revu:*),Bash(git:*),Bash(mkdir:*),Bash(cp:*),Bash(cat:*)"

      - name: submit review with revu
        env:
          # claude-code-action の outputs.github_token（Claude App のトークン）は
          # ここでは使えない。アクションは composite action の最後に "Revoke app token"
          # ステップを持ち、自分の App トークンを失効させてから終了する。後続ステップに
          # 渡る頃には死んでおり、gh auth status が "The token in GH_TOKEN is invalid" で
          # 落ちる（PR #26 で実際に発生。run 30184892810）。
          # レビューを revu[bot] 名義で投稿したい場合は自前の GitHub App が必要（REVU-32）。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # スキルの出力先は pr-{N}/{sha[:7]}/ で、head_sha はスキルの
          # サブプロセスの中でしか判明しない。ここでは pr-{N} の親を渡し、
          # 最新の {sha}/review.yml への降下は revu submit 側に任せる。
          dir="$HOME/.revu/${{ github.repository }}/pr-${{ github.event.issue.number }}"
          if [ ! -d "$dir" ]; then
            echo "::error::$dir が存在しません（レビュー生成ステップが下書きを 1 つも書いていません）"
            exit 1
          fi
          # --no-approve: Actions の GITHUB_TOKEN は PR を承認できない（HTTP 422）ため、
          # APPROVE のレビューは COMMENT に降格して投稿する。
          revu submit --yes --accept-pending --no-approve "$dir"

      # 失敗したとき「生成されなかった」のか「置き場所が解決できなかった」のかを
      # run のログだけで切り分けられるようにする。
      - name: dump review draft layout on failure
        if: failure()
        run: |
          dir="$HOME/.revu/${{ github.repository }}/pr-${{ github.event.issue.number }}"
          echo "::group::contents of $dir"
          ls -laR "$dir" || echo "(not found: $dir)"
          echo "::endgroup::"

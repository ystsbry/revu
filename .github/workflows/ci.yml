name: ci

# Pull Request 単位で test / lint / format を並列に実行し、
# それらが成功した後に build / build-make を並列に走らせる。

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR にカバレッジレポートを sticky comment として post するため、
    # この job だけ pull-requests: write を持たせる。
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go test with coverage
        run: |
          set -o pipefail
          go test -coverprofile=coverage.out -covermode=atomic ./... \
            | tee test-output.txt

      # A package with no test files is silently counted as 0% in the
      # total and never appears in the per-package section of the comment,
      # so it needs its own annotation to be noticeable at all.
      - name: warn on packages without tests
        run: |
          # Asked of go list rather than scraped from the test output: with
          # -coverprofile those packages print "coverage: 0.0%" like any
          # other, not the "[no test files]" line they show without it.
          go list -f '{{if and (eq (len .TestGoFiles) 0) (eq (len .XTestGoFiles) 0)}}{{.ImportPath}}{{end}}' ./... \
            | grep -v '^$' > untested.txt || true
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            echo "::warning::$pkg has no test files — it counts as 0% toward the total"
          done < untested.txt
          echo "untested packages: $(wc -l < untested.txt)"

      # Coverage of the PR's base commit, for the delta in the comment.
      # ci.yml only runs on pull_request, so there is no stored run on main
      # to read from; the base has to be measured here. Best-effort: a base
      # that does not build just means the delta is omitted.
      - name: measure base coverage
        id: base
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if ! git fetch --depth=1 origin "$base" 2>/dev/null; then
            echo "could not fetch base $base; skipping the delta"
            exit 0
          fi
          git worktree add --detach /tmp/base "$base" >/dev/null 2>&1 || exit 0
          if (cd /tmp/base && go test -coverprofile=/tmp/base-coverage.out -covermode=atomic ./... >/dev/null 2>&1); then
            total=$(go tool cover -func=/tmp/base-coverage.out | awk '/^total:/{print $NF}')
            echo "total=$total" >> "$GITHUB_OUTPUT"
            echo "base coverage: $total"
          else
            echo "base tests did not pass; skipping the delta"
          fi

      - name: build coverage report
        id: cov
        env:
          BASE_TOTAL: ${{ steps.base.outputs.total }}
        run: |
          total=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $NF}')
          echo "total=$total" >> "$GITHUB_OUTPUT"

          # "84.7%" -> "84.7" for the arithmetic below.
          num=${total%\%}
          delta=""
          if [ -n "$BASE_TOTAL" ]; then
            base_num=${BASE_TOTAL%\%}
            delta=$(awk -v a="$num" -v b="$base_num" 'BEGIN{printf "%+.1f", a-b}')
            echo "delta=$delta" >> "$GITHUB_OUTPUT"
            echo "base=$BASE_TOTAL" >> "$GITHUB_OUTPUT"
          fi

          # One heading line carrying everything that decides pass/fail,
          # so the reader does not have to open the details to see it.
          threshold=$(tr -d '[:space:]' < .coverage-threshold)
          heading="## Coverage: $total"
          if [ -n "$delta" ]; then
            heading="$heading (${delta}% vs base $BASE_TOTAL)"
          fi
          heading="$heading — threshold ${threshold}%"
          echo "heading=$heading" >> "$GITHUB_OUTPUT"

          {
            echo "report<<COVEOF"
            echo
            if [ -s untested.txt ]; then
              echo "**Packages with no test files** (counted as 0% in the total):"
              echo
              while read -r pkg; do
                [ -n "$pkg" ] && echo "- \`$pkg\`"
              done < untested.txt
              echo
            fi
            echo "<details>"
            echo "<summary>Per-package coverage</summary>"
            echo
            echo '```'
            grep -E "coverage:" test-output.txt || echo "(no per-package coverage output)"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details>"
            echo "<summary>Per-function detail</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo
            echo "</details>"
            echo "COVEOF"
          } >> "$GITHUB_OUTPUT"

      - name: generate HTML coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 14

      - name: post coverage comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          message: |
            ${{ steps.cov.outputs.heading }}
            ${{ steps.cov.outputs.report }}

      # The gate runs last so the report is posted even when it fails —
      # a red job with no numbers to look at would be the worst outcome.
      #
      # The bar lives in .coverage-threshold (one place, readable outside
      # CI) and is ratcheted up as coverage work lands. It is never lowered
      # to make a red PR green: that is the whole point of the file.
      - name: coverage threshold gate
        env:
          TOTAL: ${{ steps.cov.outputs.total }}
        run: |
          threshold=$(tr -d '[:space:]' < .coverage-threshold)
          total=${TOTAL%\%}
          echo "coverage ${total}% / threshold ${threshold}%"
          awk -v got="$total" -v want="$threshold" '
            BEGIN {
              if (got + 0 < want + 0) {
                printf "::error::coverage %.1f%% is below the %.1f%% threshold in .coverage-threshold\n", got, want
                exit 1
              }
            }'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # golangci-lint-action 側で独自にキャッシュするため、ここでは無効化する。
          cache: false

      - uses: golangci/golangci-lint-action@v9
        with:
          # 明示的に固定する。`latest` だと golangci-lint 側の新リリースだけで
          # コード変更なしに CI が赤くなるため、更新は PR として入れる。
          # .golangci.yml は `version: "2"` なので v2 系を追う。
          version: v2.12.2

  # 拡張 linter セット (.golangci.next.yml) を「まだ守れていないライン」として動かす job。
  # 指摘は PR に annotation として出るが、continue-on-error なので CI は赤くならない。
  #
  # 返済が終わった linter から .golangci.yml 側（上の lint job = ブロッキング）へ移し、
  # 最終的にこの job は lint に統合して削除する。
  lint-next:
    runs-on: ubuntu-latest
    # dupl / gocyclo の分だけ lint job より長めに取る。
    timeout-minutes: 15
    # 指摘サマリを PR に sticky comment として post するため、
    # test job（カバレッジ）と同様にこの job だけ write を持たせる。
    permissions:
      contents: read
      pull-requests: write
      # コメントに貼る job の URL を Actions API から引くため。
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # golangci-lint-action 側で独自にキャッシュするため、ここでは無効化する。
          cache: false

      - uses: golangci/golangci-lint-action@v9
        # job ではなく step に付けるのが重要。
        # job レベルに付けるとワークフロー全体の conclusion は success になるが、
        # job 自身の conclusion は failure のままで、PR には赤いチェックとして残る。
        # step レベルなら job が success になり、指摘は annotation としてだけ出る。
        # 「常に赤い」状態が続くと本物の失敗を見逃すため、こちらを採る。
        # ここを外してブロッキングに昇格させるのがこのプロジェクトのゴール。
        continue-on-error: true
        with:
          # lint job と同じバージョンを使う。更新するときは両方揃えること。
          version: v2.12.2
          # text 出力は既定どおり stdout（＝ログと annotation）へ流しつつ、
          # レポート組み立て用に JSON をファイルへ出す。
          args: --config=.golangci.next.yml --output.json.path=lint-report.json

      - name: build lint report
        id: lint
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # コメントから直接 job のログへ飛べるようにする。
          # job の数値 ID は workflow context から取れないため API で引き、
          # 失敗したら run の URL にフォールバックする。
          job_url=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
            --jq '.jobs[] | select(.name == "lint-next") | .html_url' 2>/dev/null | head -1 || true)
          # API が失敗すると stdout にエラーボディが漏れることがあるため、
          # 空チェックではなく URL の形そのものを検証する。
          case "$job_url" in
            https://*) ;;
            *) job_url="$RUN_URL" ;;
          esac
          echo "job_url=$job_url" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

          # 上の step が lint 実行前に落ちた場合（インストール失敗など）に備える。
          if [ ! -f lint-report.json ]; then
            echo "total=unknown" >> "$GITHUB_OUTPUT"
            {
              echo "report<<LINTEOF"
              echo
              echo "レポートを生成できませんでした。lint-next の job ログを確認してください。"
              echo "LINTEOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          total=$(jq '.Issues // [] | length' lint-report.json)
          echo "total=$total" >> "$GITHUB_OUTPUT"

          {
            echo "report<<LINTEOF"
            echo
            if [ "$total" -eq 0 ]; then
              echo "指摘はありません。.golangci.next.yml の linter を .golangci.yml へ移し、"
              echo "ブロッキングに昇格できる状態です（REVU-50）。"
            else
              echo "| linter | 件数 |"
              echo "| --- | ---: |"
              jq -r '.Issues | group_by(.FromLinter) | map({l: .[0].FromLinter, n: length})
                     | sort_by(-.n) | .[] | "| \(.l) | \(.n) |"' lint-report.json
              echo "| **合計** | **$total** |"
              echo
              echo "<details>"
              echo "<summary>ファイル別（上位 20）</summary>"
              echo
              echo "| ファイル | 件数 |"
              echo "| --- | ---: |"
              jq -r '.Issues | group_by(.Pos.Filename) | map({f: .[0].Pos.Filename, n: length})
                     | sort_by(-.n) | .[0:20][] | "| `\(.f)` | \(.n) |"' lint-report.json
              echo
              echo "</details>"
              echo
              echo "<details>"
              echo "<summary>指摘一覧</summary>"
              echo
              echo '```'
              jq -r '.Issues | sort_by(.Pos.Filename, .Pos.Line) | .[0:100][]
                     | "\(.Pos.Filename):\(.Pos.Line): \(.Text) (\(.FromLinter))"' lint-report.json
              if [ "$total" -gt 100 ]; then
                echo
                echo "... 他 $((total - 100)) 件（全件は上記の実行ログ、または artifact の lint-report.json を参照）"
              fi
              echo '```'
              echo
              echo "</details>"
            fi
            echo "LINTEOF"
          } >> "$GITHUB_OUTPUT"

      - name: upload lint report artifact
        if: hashFiles('lint-report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: lint-next-report
          path: lint-report.json
          retention-days: 14

      - name: post lint comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: lint-next
          message: |
            ## Lint (next): ${{ steps.lint.outputs.total }} issues

            standard セットを超える拡張 linter（`.golangci.next.yml`）の結果。
            [実行ログ](${{ steps.lint.outputs.job_url }}) ・ [全件 JSON (artifact)](${{ steps.lint.outputs.run_url }})

            **このチェックは意図的に非ブロッキングです。** 既存コードに未返済の指摘が残っているため、
            ここを赤くすると全 PR が常時赤くなり、本物の失敗を見逃すことになります。
            守るべきラインはブロッキングの `lint` job（standard セット・常にゼロ）が担保しています。

            指摘がゼロになったら `.golangci.next.yml` を `.golangci.yml` に統合し、
            この job も `lint` に統合して削除する予定です。
            ${{ steps.lint.outputs.report }}

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

  # リリースターゲット (linux/darwin × amd64/arm64) 全てでクロスコンパイル可能か確認する。
  # issue #1 のような「特定アーキで突然壊れる」事案を PR 段階でブロックすることが目的。
  build:
    needs: [test, lint, format]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

  # Makefile 経由のビルドが壊れていないかをスモーク的に確認するジョブ。
  # cgo guard もここで一度だけ動かす（grep するだけで GOOS/GOARCH に依存しないため）。
  build-make:
    needs: [test, lint, format]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: cgo guard (warning)
        # リリースは CGO_ENABLED=0 固定 (.goreleaser.yaml) なので、
        # `import "C"` が混入すると ARM ホスト + amd64 Go (issue #1) のような環境で再び壊れる。
        # 強制 fail はせず、PR に warning annotation を出すに留める。
        run: |
          hits=$(grep -RIn --include='*.go' '^[[:space:]]*import[[:space:]]\+"C"' . || true)
          if [ -n "$hits" ]; then
            echo "::warning::cgo (import \"C\") を検出。リリースは CGO_ENABLED=0 のため CGO 依存コードは混入させない方針です。"
            echo "$hits"
          fi

      - name: make build
        run: make build
